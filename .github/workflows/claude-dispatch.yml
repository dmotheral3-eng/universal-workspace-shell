name: Claude Dispatch

# Headless Claude Code worker (corrected 2026-07-20, RUNNER-REVIVE-1, Option B).
# The orchestrator triggers this via workflow_dispatch (dispatch_id + ticket + prompt).
#
# HOW IT WORKS (and why):
# - claude-code-action@v1 exposes NO branch output and sandboxes its tools by default,
#   so runs "succeeded" while pushing nothing. Here the runner is granted its tools and
#   Claude creates branch claude/<id8>, commits, and PUSHES it itself.
# - The Actions GITHUB_TOKEN is forbidden by repo policy from creating PRs. So this
#   workflow does NOT open the PR. It reports the pushed branch to the Supabase
#   dispatch-callback function (authenticated with a per-run GitHub OIDC token), and
#   that function opens the DRAFT PR server-side using the Vault dispatch PAT. Branch
#   protection stays untouched; Actions can never approve or merge.
# - Blocked runs push .dispatch/QUESTION.md on the branch; the callback opens a
#   "QUESTION:" draft PR so a human can rule. Never stop empty-handed.

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: "Orchestrator-side id for this dispatch (echoed back in the callback)"
        required: true
        type: string
      ticket:
        description: "Ticket key/title - used as the PR title"
        required: true
        type: string
      prompt:
        description: "The task for Claude Code to perform"
        required: true
        type: string
      base_branch:
        description: "Branch to check out and branch the work from (PR targets this)"
        required: false
        default: main
        type: string

# Least privilege: contents:write for the runner's push, id-token:write for the OIDC
# callback. PR creation is server-side (Vault PAT), so no pull-requests permission here.
permissions:
  contents: write
  id-token: write

# One in-flight run per dispatch id. Do NOT cancel in progress - a killed run would
# skip the callback and leave the orchestrator hanging.
concurrency:
  group: claude-dispatch-${{ github.event.inputs.dispatch_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v5  # node24 — v4 targets the deprecated node20 runtime (COS-336)
        with:
          ref: ${{ inputs.base_branch }}
          # Full history so the runner can branch and diff cleanly.
          fetch-depth: 0

      - name: Compute dispatch branch name
        id: vars
        env:
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          set -euo pipefail
          SHORT="${DISPATCH_ID:0:8}"
          echo "branch=claude/${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # For any gh CLI Claude runs; git push uses the checkout-persisted credential.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Auth via the repo secret ANTHROPIC_API_KEY.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          base_branch: ${{ inputs.base_branch }}
          # Headless trusted runner: grant Claude its tools. The action's default sandbox
          # denies Bash/git/Write (permission_denials), which is why prior runs pushed nothing.
          claude_args: "--dangerously-skip-permissions"
          # The action exposes no branch output, so Claude does the git itself.
          prompt: |
            You are running headless in GitHub Actions on ${{ github.repository }} (base branch ${{ inputs.base_branch }}).

            MANDATORY GIT PROTOCOL - you MUST perform these yourself with the Bash tool.
            This action exposes no branch output and nothing else will push for you:
              1. git checkout -b ${{ steps.vars.outputs.branch }}
              2. Complete the TASK below, editing files as needed.
              3. git add -A && git commit -m "${{ inputs.ticket }}"
              4. git push origin ${{ steps.vars.outputs.branch }}

            NEVER STOP EMPTY-HANDED. If you are blocked, cannot complete the task, or need
            a human ruling: write the question and full context to .dispatch/QUESTION.md,
            then run steps 1, 3, 4 to push branch ${{ steps.vars.outputs.branch }} carrying
            that file. A QUESTION draft PR will open so a human can rule.

            Push exactly one branch. Do NOT open a pull request yourself - the callback does that.

            TASK:
            ${{ inputs.prompt }}

      - name: Report to Supabase callback (opens the PR server-side)
        # Always run so the orchestrator learns the outcome even on failure.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALLBACK_URL: ${{ vars.SUPABASE_DISPATCH_CALLBACK_URL }}
          REPO: ${{ github.repository }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TICKET: ${{ inputs.ticket }}
          BASE: ${{ inputs.base_branch }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          STATUS: ${{ steps.claude.outcome == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "SUPABASE_DISPATCH_CALLBACK_URL not set - skipping callback."
            exit 0
          fi

          # Did the runner actually push the branch? Ask GitHub via the API - the Claude
          # action revokes the workspace git credential at step-end, so `git ls-remote`
          # would fail auth on a private repo and wrongly report "no branch".
          BRANCH_OUT=""
          IS_Q="false"
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            BRANCH_OUT="$BRANCH"
            if gh api "repos/$REPO/contents/.dispatch/QUESTION.md?ref=$BRANCH" >/dev/null 2>&1; then
              IS_Q="true"
            fi
          fi
          echo "branch on remote: '${BRANCH_OUT}' | question: ${IS_Q}"

          # Per-run GitHub OIDC token (no shared secret). Audience must equal the callback URL.
          OIDC_TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CALLBACK_URL" | jq -r .value)

          # Failure detail (COS-336): read the Claude execution output defensively.
          # Every line tolerates a missing file, bad JSON, or absent jq keys — this
          # block must NEVER break the callback (the callback firing is the door).
          # The file is FOUND, not assumed: fast deaths write it in varying temp roots.
          # The action PUBLISHES this path as an output (verified in action.yml v1:
          #   outputs.execution_file — "Path to the Claude Code execution output file").
          # Earlier revisions searched for it, which was folklore: a guess standing in
          # for a documented contract. Search is kept only as a fallback for the case
          # where the step died before publishing any output at all.
          OUT_FILE="${{ steps.claude.outputs.execution_file }}"
          if [ -z "${OUT_FILE:-}" ] || [ ! -f "$OUT_FILE" ]; then
            OUT_FILE=$(find "${RUNNER_TEMP:-/home/runner/work/_temp}" -maxdepth 2 -name 'claude-execution-output.json' 2>/dev/null | head -1)
            OUT_FILE="${OUT_FILE:-/home/runner/work/_temp/claude-execution-output.json}"
          fi
          echo "exec output file: '${OUT_FILE}'"
          # The execution file is a JSON ARRAY of message objects, not a single object.
          # -s/flatten reads all three plausible shapes (object, array, JSONL) and
          # degrades to empty on a missing / malformed / result-less file, so this block
          # still can NEVER break the callback (the callback firing is the door).
          exec_field() {
            jq -s -r --arg k "$1" \
              'flatten | map(select(.type=="result")) | last | .[$k] // empty' \
              "$OUT_FILE" 2>/dev/null || true
          }
          EXEC_SUBTYPE=$(exec_field subtype)
          EXEC_IS_ERROR=$(exec_field is_error)
          EXEC_COST=$(exec_field total_cost_usd)
          EXEC_TURNS=$(exec_field num_turns)
          EXEC_ERRTEXT=$(jq -s -r \
            'flatten | map(select(.type=="result")) | last | ((.result // .error // "") | tostring)' \
            "$OUT_FILE" 2>/dev/null | head -c 800 || true)
          echo "exec detail: subtype='${EXEC_SUBTYPE}' is_error='${EXEC_IS_ERROR}' cost='${EXEC_COST}' turns='${EXEC_TURNS}'"

          PAYLOAD=$(jq -nc \
            --arg dispatch_id "$DISPATCH_ID" \
            --arg status "$STATUS" \
            --arg run_url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg base "$BASE" \
            --arg ticket "$TICKET" \
            --arg branch "$BRANCH_OUT" \
            --argjson is_question "$IS_Q" \
            --arg exec_subtype "$EXEC_SUBTYPE" \
            --arg exec_is_error "$EXEC_IS_ERROR" \
            --arg exec_cost "$EXEC_COST" \
            --arg exec_turns "$EXEC_TURNS" \
            --arg exec_error_text "$EXEC_ERRTEXT" \
            '{dispatch_id:$dispatch_id, status:$status, run_url:$run_url, repo:$repo, base:$base, ticket:$ticket, branch:$branch, is_question:$is_question, exec:{subtype:$exec_subtype, is_error:$exec_is_error, total_cost_usd:$exec_cost, num_turns:$exec_turns, error_text:$exec_error_text}}')

          curl -sS --fail-with-body -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -d "$PAYLOAD"
